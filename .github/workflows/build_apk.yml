name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK via Gradle Direct/Flutter
        working-directory: flutter
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          mkdir -p ../output_apk
          cp build/app/outputs/flutter-apk/*.apk ../output_apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schoolar-ai-app
          path: output_apk/*.apk
